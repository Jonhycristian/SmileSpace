        scrollThread();
        setTimeout(function () {
            if (!chatOpen() || !document.body.contains(t)) return;
            t.remove();
            botBubble(html);
            if (done) done();
        }, 550);
    }

    function controlsWrap() {
        var w = document.createElement('div');
        w.className = 'chat-pick-list';
        w.dataset.seq = String(nextSeq());
        chatBody.appendChild(w);
        scrollThread();
        return w;
    }

    function lockControls(wrap, selectedEl) {
        if (!wrap) return;
        wrap.classList.add('is-answered');
        wrap.querySelectorAll('button, input, textarea').forEach(function (el) { el.disabled = true; });
        if (selectedEl) selectedEl.classList.add('selected');
    }

    function showFieldError(inputEl, errorEl, message) {
        if (errorEl) {
            errorEl.textContent = message || '';
            errorEl.classList.toggle('show', !!message);
        }
        if (inputEl) {
            if (message) inputEl.setAttribute('aria-invalid', 'true');
            else inputEl.removeAttribute('aria-invalid');
        }
    }

    function focusThreadInput(wrap) {
        var target = wrap && wrap.querySelector('textarea, input');
        if (target) { try { target.focus({ preventScroll: true }); } catch (e) { try { target.focus(); } catch (e2) {} } }
    }

    var kbBaseVV = 0, kbBaseWH = 0;
    function recordKbBaseline() {
        try {
            kbBaseVV = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            kbBaseWH = window.innerHeight;
        } catch (e) {}
    }
    function keyboardShrink() {
        var shrink = 0;
        try {
            if (window.visualViewport) shrink = Math.max(shrink, kbBaseVV - window.visualViewport.height);
            shrink = Math.max(shrink, kbBaseWH - window.innerHeight);
        } catch (e) {}
        return shrink;
    }

    function ensureFieldVisible() {
        var el = chatFocusedField;
        if (!el || !chatOpen() || !el.isConnected || !chatBody) return;
        if (isCoarsePointer() && keyboardShrink() < 120) {
            chatBody.classList.add('kb-open');
            requestAnimationFrame(function () {
                if (!el.isConnected || !chatOpen()) return;
                var tRect = chatBody.getBoundingClientRect();
                var r = el.getBoundingClientRect();
                var targetTop = tRect.top + Math.min(chatBody.clientHeight * 0.3, 220);
                chatBody.scrollTop += (r.top - targetTop);
            });
            return;
        }
        chatBody.classList.remove('kb-open');
        try { el.scrollIntoView({ behavior: 'auto', block: 'center' }); } catch (e) {}
        requestAnimationFrame(function () {
            if (!el.isConnected || !chatOpen()) return;
            var r = el.getBoundingClientRect();
            var visibleBottom = window.innerHeight;
            if (window.visualViewport) {
                visibleBottom = window.visualViewport.height + (window.visualViewport.offsetTop || 0);
            }
            if (r.bottom > visibleBottom - 12) chatBody.scrollTop += (r.bottom - (visibleBottom - 12));
        });
    }

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
            if (chatFocusedField && chatOpen()) ensureFieldVisible();
        });
    }
    window.addEventListener('resize', function () {
        if (chatFocusedField && chatOpen()) ensureFieldVisible();
    });
    window.addEventListener('orientationchange', function () {
        if (chatFocusedField && chatOpen()) setTimeout(ensureFieldVisible, 400);
    });

    function buildMessage() {
        var lines = [];
        lines.push('Olá, equipe SmileSpace!');
        lines.push('');
        lines.push('Meu nome é ' + selectedName + ' e gostaria de agendar uma consulta com o ' + DOCTOR.name + '.');
        lines.push('');
        lines.push('Motivo da consulta: ' + selectedReason);
        if (selectedDetails) {
            lines.push('');
            lines.push('Observações: ' + selectedDetails);
        }
        lines.push('');
        lines.push('Gostaria de verificar a disponibilidade e dar continuidade ao meu agendamento.');
        return lines.join('\n');
    }

    function askMotives() {
        if (!chatOpen()) return;
        stepAnchors.motivo = msgSeq + 1;
        botWithTyping('Olá! Sou da equipe do ' + DOCTOR.name + '. Como podemos ajudar?', function () {
            var wrap = controlsWrap();
            wrap.innerHTML = MOTIVES.map(function (m) {
                return '<button type="button" class="chat-option-btn" data-reason="' + escapeHtml(m.reason) + '">'
                    + '<span class="ss-ico"><i class="' + m.icon + '" aria-hidden="true"></i></span>'
                    + '<span class="ss-label">' + escapeHtml(m.label) + '</span>'
                    + '<i class="fas fa-chevron-right ss-arrow" aria-hidden="true"></i></button>';
            }).join('');
            scrollThread();
            var first = wrap.querySelector('.chat-option-btn');
            if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
        });
    }

    function onMotivePicked(btn) {
        var wrap = btn.closest('.chat-pick-list');
        var reason = btn.getAttribute('data-reason');
        lockControls(wrap, btn);
        if (reason === 'Outro Motivo') {
            selectedReason = '';
            userBubble('Outro motivo');
            askCustomReason();
        } else {
            selectedReason = reason;
            userBubble(reason);
            setTimeout(askDetails, reduceMotion ? 0 : 200);
        }
    }

    function askCustomReason() {
        if (!chatOpen()) return;
        botWithTyping('Sem problema. Descreva brevemente o motivo do seu contato.', function () {
            var wrap = controlsWrap();
            wrap.innerHTML = '<form class="chat-field" novalidate>'
                + '<label for="chatReasonNow" class="sr-only">Descreva o motivo do contato</label>'
                + '<textarea id="chatReasonNow" class="chat-textarea" rows="2" placeholder="Ex.: avaliação, dúvida sobre tratamento..." autocomplete="off"></textarea>'
                + '<div class="chat-error" role="alert"></div>'
                + '<div class="chat-actions"><button type="submit" class="chat-next-btn">Enviar <i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>'
                + '</form>';
            var form = wrap.querySelector('form');
            var input = wrap.querySelector('textarea');
            var err = wrap.querySelector('.chat-error');
            input.addEventListener('input', function () { showFieldError(input, err, ''); });
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var v = input.value.trim();
                if (v.length < 3) { showFieldError(input, err, 'Descreva em poucas palavras o motivo do contato.'); input.focus(); return; }
                showFieldError(input, err, '');
                selectedReason = v;
                wrap.remove();
                userBubble(v);
                setTimeout(askDetails, reduceMotion ? 0 : 200);
            });
            scrollThread();
            focusThreadInput(wrap);
        });
    }

    function askDetails() {
        if (!chatOpen()) return;
        stepAnchors.detalhes = msgSeq + 1;
        botWithTyping('Quer nos contar mais? Se quiser, deixe alguma informação que possa nos ajudar no atendimento.', function () {
            var wrap = controlsWrap();
            wrap.innerHTML = '<form class="chat-field" novalidate>'
                + '<label for="chatDetailsNow" class="sr-only">Detalhes adicionais (opcional)</label>'
                + '<textarea id="chatDetailsNow" class="chat-textarea" rows="2" placeholder="Opcional — ex.: sensibilidade, preferência de horário..." autocomplete="off"></textarea>'
                + '<div class="chat-actions"><button type="submit" class="chat-next-btn">Continuar <i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>'
                + '</form>';
            var form = wrap.querySelector('form');
            var input = wrap.querySelector('textarea');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var v = input.value.trim();
                selectedDetails = v;
                wrap.remove();
                if (v) userBubble(v);
                setTimeout(askName, reduceMotion ? 0 : 200);
            });
            scrollThread();
            focusThreadInput(wrap);
        });
    }

    function askName() {
        if (!chatOpen()) return;
        stepAnchors.nome = msgSeq + 1;
        botWithTyping('Como podemos te chamar? Informe seu nome e sobrenome.', function () {
            var wrap = controlsWrap();
            wrap.innerHTML = '<form class="chat-field" novalidate>'
                + '<label for="chatNameNow" class="sr-only">Nome e sobrenome</label>'
                + '<input type="text" id="chatNameNow" class="chat-input" placeholder="Nome e sobrenome" autocomplete="name" enterkeyhint="next">'
                + '<div class="chat-error" role="alert"></div>'
                + '<div class="chat-actions"><button type="submit" class="chat-next-btn">Continuar <i class="fas fa-arrow-right" aria-hidden="true"></i></button></div>'
                + '</form>';
            var form = wrap.querySelector('form');
            var input = wrap.querySelector('input');
            var err = wrap.querySelector('.chat-error');
            input.addEventListener('input', function () { showFieldError(input, err, ''); });
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var v = input.value.trim().replace(/\s+/g, ' ');
                if (v.length < 2) { showFieldError(input, err, 'Informe seu nome para continuar.'); input.focus(); return; }
                if (v.split(' ').length < 2) { showFieldError(input, err, 'Por favor, informe nome e sobrenome.'); input.focus(); return; }
                showFieldError(input, err, '');
                selectedName = v;
                wrap.remove();
                userBubble(v);
                setTimeout(showSummary, reduceMotion ? 0 : 200);
            });
            scrollThread();
            focusThreadInput(wrap);
        });
    }

    function summaryRowsHtml() {
        var html = '';
        html += '<div class="chat-summary-row"><i class="fas fa-tooth" aria-hidden="true"></i><span class="chat-summary-text"><strong>Motivo</strong>' + escapeHtml(selectedReason) + '</span></div>';
        if (selectedDetails) html += '<div class="chat-summary-row"><i class="fas fa-comment" aria-hidden="true"></i><span class="chat-summary-text"><strong>Observações</strong>' + escapeHtml(selectedDetails) + '</span></div>';
        html += '<div class="chat-summary-row"><i class="fas fa-user" aria-hidden="true"></i><span class="chat-summary-text"><strong>Nome</strong>' + escapeHtml(selectedName) + '</span></div>';
        return html;
    }

    function reviewListHtml() {
        var items = [
            { key: 'motivo', label: 'Motivo', value: selectedReason },
            { key: 'detalhes', label: 'Detalhes', value: selectedDetails || '—' },
            { key: 'nome', label: 'Nome', value: selectedName }
        ];
        return items.map(function (it) {
            return '<div class="chat-review-item"><span class="chat-review-text"><strong>' + it.label + '</strong>' + escapeHtml(it.value) + '</span>'
                + '<button type="button" data-edit="' + it.key + '" aria-label="Alterar ' + it.label + '">Alterar</button></div>';
        }).join('');
    }

    function showSummary() {
        if (!chatOpen()) return;
        stepAnchors.resumo = msgSeq + 1;
        botWithTyping('Tudo certo? Confira suas respostas:', function () {
            var wrap = controlsWrap();
            var url = 'https://wa.me/' + DOCTOR.phone + '?text=' + encodeURIComponent(buildMessage());
            if (chatCtaBtn) chatCtaBtn.href = url;
            if (chatCtaBar) chatCtaBar.classList.remove('hidden');
            wrap.innerHTML = '<div class="chat-summary-card">' + summaryRowsHtml() + '</div>'
                + '<p class="chat-hint">Toque no botão abaixo para abrir o WhatsApp com sua mensagem pronta.</p>'
                + '<button type="button" class="chat-review-toggle"><i class="fas fa-pen" aria-hidden="true"></i> Revisar informações</button>'
                + '<div class="chat-review-list" hidden></div>';
            var toggle = wrap.querySelector('.chat-review-toggle');
            var list = wrap.querySelector('.chat-review-list');
            toggle.addEventListener('click', function () {
                if (list.hasAttribute('hidden')) {
                    list.innerHTML = reviewListHtml();
                    list.removeAttribute('hidden');
                    toggle.innerHTML = '<i class="fas fa-chevron-up" aria-hidden="true"></i> Ocultar revisão';
                } else {
                    list.setAttribute('hidden', '');
                    list.innerHTML = '';
                    toggle.innerHTML = '<i class="fas fa-pen" aria-hidden="true"></i> Revisar informações';
                }
                scrollThread();
            });
            scrollThread();
            try { chatCtaBtn.focus({ preventScroll: true }); } catch (e) {}
        });
    }

    function hideCtaBar() {
        if (chatCtaBar) chatCtaBar.classList.add('hidden');
        if (chatCtaBtn) chatCtaBtn.removeAttribute('href');
    }

    function editAnswer(key) {
        var anchor = stepAnchors[key];
        if (anchor == null) return;
        hideCtaBar();
        chatBody.querySelectorAll('[data-seq]').forEach(function (el) {
            if (parseInt(el.dataset.seq, 10) >= anchor) el.remove();
        });
        scrollThread();
        if (key === 'motivo') { selectedReason = ''; selectedDetails = ''; selectedName = ''; askMotives(); }
        else if (key === 'detalhes') { selectedDetails = ''; selectedName = ''; askDetails(); }
        else if (key === 'nome') { selectedName = ''; askName(); }
    }

    function resetChat() {
        selectedReason = ''; selectedDetails = ''; selectedName = '';
        chatFocusedField = null;
        hideCtaBar();
        if (chatBody) {
            chatBody.classList.remove('kb-open');
            chatBody.innerHTML = '';
        }
        msgSeq = 0;
        Object.keys(stepAnchors).forEach(function (k) { delete stepAnchors[k]; });
    }

    function openChat(triggerButton) {
        if (!chatModal) return;
        previouslyFocusedElement = triggerButton || document.activeElement;
        chatModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        resetChat();
        askMotives();
    }

    function closeChat() {
        if (!chatModal) return;
        chatModal.classList.add('hidden');
        document.body.style.overflow = '';
        resetChat();
        if (previouslyFocusedElement && previouslyFocusedElement.focus) { try { previouslyFocusedElement.focus(); } catch (e) {} previouslyFocusedElement = null; }
    }

    if (agendarBtn) agendarBtn.addEventListener('click', function (e) { e.preventDefault(); openChat(agendarBtn); });
    if (chatCloseBtn) chatCloseBtn.addEventListener('click', closeChat);
    if (chatModal) chatModal.addEventListener('click', function (e) { if (e.target === chatModal) closeChat(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && chatModal && !chatModal.classList.contains('hidden')) closeChat();
    });
    if (chatCtaBtn) chatCtaBtn.addEventListener('click', function () {
        try { localStorage.setItem('ss_wa_lead_at', String(Date.now())); } catch (e) {}
        setTimeout(closeChat, 600);
    });

    if (chatBody) {
        chatBody.addEventListener('click', function (e) {
            var opt = e.target.closest('.chat-option-btn');
            if (opt && !opt.disabled) { onMotivePicked(opt); return; }
            var edit = e.target.closest('[data-edit]');
            if (edit) { e.preventDefault(); editAnswer(edit.getAttribute('data-edit')); }
        });
        chatBody.addEventListener('focusin', function (e) {
            if (e.target.matches && e.target.matches('.chat-input, .chat-textarea')) {
                chatFocusedField = e.target;
                recordKbBaseline();
                setTimeout(ensureFieldVisible, 350);
                setTimeout(ensureFieldVisible, 950);
            }
        });
        chatBody.addEventListener('focusout', function (e) {
            setTimeout(function () {
                var active = document.activeElement;
                if (!active || !active.matches || !active.matches('.chat-input, .chat-textarea')) {
                    chatFocusedField = null;
                    chatBody.classList.remove('kb-open');
                }
            }, 100);
        });
    }
})();
</script>

</body>
</html>
